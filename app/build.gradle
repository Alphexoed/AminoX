apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "kotlin-android-extensions"
apply plugin: "com.google.gms.google-services"

android {
    signingConfigs {
        release {
            storeFile file('C:\\Users\\Slimakoi\\AndroidStudioProjects\\aminox-proguard-key.jks')
            storePassword 'portimaokoi99'
            keyAlias 'aminox'
            keyPassword 'portimaokoi99'
        }
    }
    compileSdkVersion 30
    buildToolsVersion "30.0.2"

    defaultConfig {
        applicationId "com.slimakoi.aminox"
        minSdkVersion 26
        targetSdkVersion 30
        versionCode 2703
        versionName "2.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        proguardFiles

        ndk {
            // This will strip all non-supported ABI sets from the final APK file.
            abiFilters "x86", "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            debuggable false
            multiDexEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
    sourceSets {
        main {
            assets {
                srcDirs "src\\main\\assets"
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8

    kotlinOptions {
        //jvmTarget = '1.8'
