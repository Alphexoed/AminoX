apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'com.google.gms.google-services'

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.3"

    defaultConfig {
        applicationId "com.slimakoi.aminox"
        minSdkVersion 26
        targetSdkVersion 29
        versionCode 2602
        versionName "2.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        proguardFiles

        ndk {
            // This will strip all non-supported ABI sets from the final APK file.
            abiFilters 'x86', 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            multiDexEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
    sourceSets {
        main {
            assets {
                srcDirs 'src\\main\\assets'
            }
        }
    }
}

repositories {
    jcenter()
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation("com.squareup.okhttp3:okhttp:4.9.0")
    implementation 'com.github.ultimate-deej:twowaynestedscrollview:0.1'
    implementation "io.karn:khttp-android:0.1.2"
    implementation 'com.pes.materialcolorpicker:library:1.2.5'
    //implementation platform('com.google.firebase:firebase-bom:26.1.0')
    //implementation 'com.google.firebase:firebase-analytics-ktx'
    //implementation 'com.google.firebase:firebase-analytics:18.0.3'
    //implementation 'com.google.firebase:firebase-auth-ktx'
    //implementation 'com.google.android.gms:play-services-auth:19.0.0'
    //implementation 'com.google.android.gms:play-services-ads:20.0.0'
    //implementation 'com.google.android.gms:play-services-basement:17.6.0'
    //implementation 'com.google.gms:google-services:4.3.5'
    //implementation 'org.conscrypt:conscrypt-android:2.5.0'
    //implementation 'androidx.appcompat:appcompat:1.2.0'
    //implementation 'androidx.gridlayout:gridlayout:1.0.0'
    //implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    //implementation 'com.beust:klaxon:5.0.1'
    //implementation 'com.tapjoy:tapjoy-android-sdk:12.4.2@aar'
    implementation 'androidx.core:core-ktx:1.5.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation "org.jetbrains.anko:anko:0.10.8"
    implementation "org.jetbrains.kotlin:kotlin-reflect:1.4.30"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
